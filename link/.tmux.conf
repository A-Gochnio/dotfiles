# remap prefix from "C-b" to "C-a"
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# copy-paste support with xclip, enabling space-enter copying
set-window-option -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# new windows open in $HOME
bind c new-window -c "$HOME"

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# activate mouse mode
set -g mouse on

# send to all-panes mode
bind * setw synchronize-panes

# disallow tmux to rename windows
set -g allow-rename off

# set zsh as default shell
set-option -g default-shell /bin/zsh
# /bin/zsh is a universal binary, so we need to select the arm64 architecture for that M1 juice
set-option -g default-command "arch -arch arm64 /bin/zsh"

######################
### DESIGN CHANGES ###
######################

## Status bar design
# status line
set -g status-justify left
set -g status-interval 2

# window status
setw -g window-status-format " #F#I:#W#F "
setw -g window-status-current-format " #F#I:#W#F "
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "tmux-256color"

# Enable true color and modern terminal features for iTerm2/xterm
set -ga terminal-overrides ",xterm-256color:Tc,xterm-256color:smcup=\\E[?1049h,xterm-256color:rmcup=\\E[?1049l"

# The modes {
setw -g clock-mode-colour colour135
setw -g mode-style "fg=colour196,bg=colour238,bold"

# }
# The panes {

set -g pane-border-style "fg=colour238,bg=colour235"
set -g pane-active-border-style "fg=colour51,bg=colour236"

# }
# The statusbar {

set -g status-position bottom
set -g status-style "fg=colour137,bg=colour234,dim"
set -g status-left ''
set -g status-right '#{prefix_highlight}#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style "fg=colour81,bg=colour238,bold"
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style "fg=colour138,bg=colour235,none"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style "fg=colour255,bg=colour1,bold"

# }
# The messages {

set -g message-style "fg=colour232,bg=colour166,bold"
set -g message-command-style "fg=blue,bg=black"

# }


######################
###### Plugins #######
######################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux resurrect - saves and restores sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum, uses tmux resurrect to restore between computer restarts
set -g @plugin 'tmux-plugins/tmux-continuum'

# Shows whether prefix has been pressed
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# It will also show whenever copy mode is on
set -g @prefix_highlight_show_copy_mode 'on'

set -g @continuum-restore 'on'

# Enable word navigation with option+arrow keys
bind-key -n M-Left send-keys M-b
bind-key -n M-Right send-keys M-f

run '~/.tmux/plugins/tpm/tpm'
